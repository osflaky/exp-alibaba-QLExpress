name: Java Unit Test with Maven

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 11
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-11-arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: '${{ matrix.java }}'
          # Temurin publishes no Windows aarch64 builds for older Java versions;
          # the Microsoft Build of OpenJDK ships native Windows ARM64 JDKs for 11, 17, 21 and 25.
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'microsoft' || 'temurin' }}
        architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}
    - name: Run tests with Maven
      run: mvn -B clean test --file pom.xml
    - name: Upload results to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    name: test [${{ matrix.expander_leg }}]
    timeout-minutes: 150
